[package]
name = "pagemd"
version = "0.9.1"
edition = "2021"
build = "build.rs"
description = "Convert Markdown into a self-contained, styled HTML document"
readme = "README.md"
keywords = ["markdown", "html", "singlefile", "renderer"]
categories = ["command-line-utilities", "text-processing"]

[lib]
name = "pagemd"
path = "src/lib.rs"

[[bin]]
name = "pagemd"
path = "src/main.rs"

[build-dependencies]
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }

[features]
default = []
gpui = ["dep:pagemd-gpui"]

[dependencies]
pagemd-parser = { path = "crates/parser" }
pagemd-gpui = { path = "crates/gpui", optional = true }
clap = { version = "4.6", features = ["derive"] }
syntect = "5.3"
base64 = "0.22"
# Keep the stable Mermaid layout stack aligned across HTML and GPUI builds.
merman = { version = "=0.8.0", features = ["complete-svg-elk"] }
merman-core = "=0.8.0"
merman-render = "=0.8.0"
merman-layout-elk = "=0.8.0"
merman-elk-layered = "=0.8.0"
dugong = "=0.8.0"
dugong-graphlib = "=0.8.0"
manatee = "=0.8.0"
plantuml_encoding = "2.0.3"
regex = "1.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
ratex-svg = { version = "0.0.15", features = ["standalone", "cli"] }
ratex-parser = "0.0.15"
ratex-layout = "0.0.15"
ratex-types = "0.0.15"
ratex-font = "0.0.15"
anyhow = "1"
ratex-katex-fonts = "0.1.8"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "io-util", "sync"] }
notify = "8"
notify-debouncer-mini = "0.6"
async-stream = "0.3"
futures = "0.3"
futures-util = "0.3"
tokio-tungstenite = "0.26"
serde_json = "1"
uuid = { version = "1", features = ["v4", "v5"] }
rustyline = "15"
html-to-markdown-rs = "2.26"
rayon = "1.10"
which = "7"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
dirs = "6"

# GPUI's existing dependency API delegates to the shared PageMD parser.
