[workspace]
resolver = "2"
members = [
    "crates/pagemd-core",
    "crates/pagemd-parser",
    "crates/pagemd-openapi",
    "crates/pagemd-gpui",
    "client/cli",
    "bindings/shared",
    "bindings/ios",
    "bindings/android",
]
# `cargo build` / `cargo test` at the root cover the library and the CLI.
# The GPUI renderer and the mobile bindings build with `-p <crate>` or
# `--workspace`.
default-members = [
    "crates/pagemd-core",
    "crates/pagemd-parser",
    "crates/pagemd-openapi",
    "client/cli",
]
# The Chrome extension's wasm crate targets wasm32 and has its own lockfile.
exclude = ["client/chrome/wasm"]

[workspace.package]
version = "0.10.0"
edition = "2021"
repository = "https://github.com/ikey4u/pagemd"
