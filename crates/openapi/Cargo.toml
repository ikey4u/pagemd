[package]
name = "pagemd-openapi"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Display-only OpenAPI model shared by PageMD renderers"

[features]
default = []
io = ["dep:reqwest", "dep:futures-lite"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
pagemd-parser = { path = "../parser" }
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"], optional = true }
futures-lite = { version = "2", optional = true }
